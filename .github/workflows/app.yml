name: Build

on:
  push:
    tags:
      - 'v*'          # e.g. v2.5.0.2 -> build all 3 OS + publish a Release
  workflow_dispatch:   # manual "Run workflow" button (build only, no Release)

permissions:
  contents: write      # needed to create the GitHub Release

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon (arm64) — required by build-macos.sh
            target: macos
            os_token: macARM64    # detect_os() token used in the patch url
          - os: ubuntu-latest
            target: linux
            os_token: linux
          - os: windows-latest
            target: windows
            os_token: win
    steps:
      - uses: actions/checkout@v4

      # Python 3.14 provided by the runner for Linux/Windows.
      # macOS build-macos.sh installs its own official 3.14 pkg (ships tkinter/ssl),
      # so we don't wire setup-python there.
      - name: Set up Python 3.14.5
        if: matrix.target != 'macos'
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'   # build-linux.sh requires an exact match

      # --- macOS: nuitka standalone .app bundle ---
      - name: Build macOS
        if: matrix.target == 'macos'
        run: |
          chmod +x build-macos.sh
          ./build-macos.sh

      # --- Linux: nuitka onefile. Pass the runner's Python so the script
      #     skips its pyenv/3.14 lookup. ---
      - name: Build Linux
        if: matrix.target == 'linux'
        env:
          PYTHON_BIN: ${{ env.pythonLocation }}/bin/python
        run: |
          chmod +x build-linux.sh
          ./build-linux.sh

      # --- Windows: pyinstaller onefile. The .bat only runs pyinstaller,
      #     so install deps + pyinstaller here first. ---
      - name: Install Windows build deps
        if: matrix.target == 'windows'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build Windows
        if: matrix.target == 'windows'
        shell: cmd
        run: build-windows.bat

      # Rename the produced zip to the exact name the updater downloads:
      #   update.json url_base -> LinSoTracker-<os_token>-<version>.zip
      # (mac/linux drop a versioned zip in dist/, windows one at repo root).
      - name: Collect package
        shell: bash
        run: |
          mkdir -p out
          if command -v python >/dev/null 2>&1; then
            version="$(python Tools/sync_version.py --print-version)"
          else
            version="$(python3 Tools/sync_version.py --print-version)"
          fi
          [ -z "$version" ] && { echo "Could not read version"; exit 1; }
          patch_name="LinSoTracker-${{ matrix.os_token }}-${version}.zip"

          case "${{ matrix.target }}" in
            windows)
              source_zip="LinSoTracker-win-x64.zip"
              ;;
            macos|linux)
              source_zip="$(find dist -maxdepth 1 -type f -name '*.zip' -print -quit)"
              ;;
            *)
              echo "Unsupported build target: ${{ matrix.target }}"
              exit 1
              ;;
          esac

          [ -n "$source_zip" ] && [ -f "$source_zip" ] || {
            echo "No zip produced for ${{ matrix.target }}"
            exit 1
          }
          cp "$source_zip" "out/${patch_name}"
          echo "Patch package: ${patch_name}"
          ls -l out

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')   # only on tag pushes
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: artifacts/**/*.zip
